name: Deploy Project WADANI Dashboard to GitHub Pages

on:
  push:
    branches:
      - claude/project-wadani-dashboard-eltne1
      - claude/banana-claude-skill-i4sk8v
    paths:
      - "dashboards/project-wadani-vgis/dashboard-standalone.html"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir -p _site
          cp dashboards/project-wadani-vgis/dashboard-standalone.html _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

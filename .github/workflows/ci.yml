name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate plugin/marketplace JSON manifests
        run: |
          python -c "
          import json, glob
          for f in glob.glob('.claude-plugin/*.json'):
              json.load(open(f))
              print(f'OK: {f}')
          "
      - name: Compile skill scripts
        run: python -m py_compile skills/banana/scripts/*.py

  webapp-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m py_compile app/*.py
      - run: pytest -q

  webapp-docker-build:
    runs-on: ubuntu-latest
    needs: webapp-test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -t banana-image-studio ./webapp

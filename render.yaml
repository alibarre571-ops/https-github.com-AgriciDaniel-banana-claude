services:
  - type: web
    name: wadani-vgis-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run migrate && npm run seed
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wadani-vgis-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"

databases:
  - name: wadani-vgis-db
    plan: free

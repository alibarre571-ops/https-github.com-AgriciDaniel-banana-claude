<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Banana Image Studio</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    <h1>🍌 Banana Image Studio</h1>
    <p class="subtitle">Generate and edit images with Google Gemini's Nano Banana models.</p>

    <div class="tabs">
      <button class="tab-btn active" data-tab="generate" type="button">Generate</button>
      <button class="tab-btn" data-tab="edit" type="button">Edit</button>
    </div>

    <section id="generate" class="tab-panel active">
      <form id="generate-form">
        <label>Prompt
          <textarea name="prompt" rows="3" required placeholder="a hero image for a coffee shop website"></textarea>
        </label>
        <div class="row">
          <label>Aspect ratio
            <select name="aspect_ratio">
              <option>1:1</option>
              <option selected>16:9</option>
              <option>9:16</option>
              <option>4:3</option>
              <option>3:4</option>
              <option>2:3</option>
              <option>3:2</option>
            </select>
          </label>
          <label>Resolution
            <select name="resolution">
              <option>1K</option>
              <option selected>2K</option>
              <option>4K</option>
            </select>
          </label>
        </div>
        <button type="submit">Generate</button>
      </form>
    </section>

    <section id="edit" class="tab-panel">
      <form id="edit-form">
        <label>Image
          <input type="file" name="image" accept="image/*" required>
        </label>
        <label>Instruction
          <textarea name="prompt" rows="3" required placeholder="remove the background"></textarea>
        </label>
        <button type="submit">Edit</button>
      </form>
    </section>

    <p id="status" role="status"></p>
    <div id="result"></div>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
